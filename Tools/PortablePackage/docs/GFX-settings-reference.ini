# Sample settings for the Dolphin Remix backend.  ({{VERSION}})
#
# Merge the [Settings] block below into:
#   User\Config\GFX.ini            (this portable build)
#   %APPDATA%\Dolphin Emulator\Config\GFX.ini   (a normal install)
#
# These CANNOT be passed on the command line. "--config GFX.Settings.X=Y" is
# silently ignored; only "--config Dolphin.Core.GFXBackend=Remix" works there.
#
# Any of these can also be set FOR ONE GAME ONLY, which is usually the better
# place for a tweak you do not want everywhere. Create
#   User\GameSettings\<GameID>.ini      (e.g. GZLE01.ini for Wind Waker)
# containing a [Video_Settings] section with the same keys:
#
#   [Video_Settings]
#   RemixGxLightDropDistant = True
#
# The full option reference (all 60 knobs) is in the source repository at
#   Source/Core/VideoBackends/Remix/README.md

[Settings]

# --- Required ---

# Dolphin's CPU-side culling drops draws before the backend ever sees them.
CPUCull = False

# --- Per-game Remix files (v0.0.4) ---

# Each game gets its own Remix settings, mods, captures and runtime log under
#   Remix\<GameID>\
# next to Dolphin.exe. rtx.conf stores texture and mesh HASHES, which mean
# nothing outside the game they were tagged in - sharing one file across games
# is how a leftover skybox tag from one title deletes another title's sky.
#
# The rtx.conf and user.conf next to Dolphin.exe are TEMPLATES: a new game's
# folder is copied from them once, then the game is independent and the
# templates are never read or written again.
#
# False restores a single shared set of files for every game.
RemixPerGamePaths = True

# Where those folders live. Empty = a Remix folder next to Dolphin.exe (falling
# back to the Dolphin user folder if that is not writable). Worth setting
# deliberately: the RTX Remix Toolkit links a mod project to one of these
# folders, and moving or renaming it afterwards breaks that link.
# RemixPerGameRoot =

# Load mods from the game's own folder rather than the shared rtx-remix\mods.
# The runtime accepts only ONE mods folder, so this is a choice between the two,
# not an addition - with this on the shared folder is not searched at all. Turn
# it off if you keep mods there that every game should see.
RemixPerGameMods = True

# The runtime filename. Must NOT be d3d9.dll: Qt's platform plugin imports that
# name, so Windows would load the runtime during startup, before a game is
# picked, which makes the per-game files above impossible.
RemixDllPath = d3d9-remix.dll

# --- Camera ---

# GameCube/Wii have no separate view matrix: xfmem.posMatrices hold a combined
# modelview. This defaults to False, and with it off the camera sits at the
# origin and the world swings around it instead of the camera moving through it.
# RemixCameraFromModelview (already on by default) takes the view matrix from the
# dominant position-matrix slot, but only runs when this is enabled.
RemixCameraRecovery = True

# --- Sky ---

# 0 = off, 1 = detect and log only, 2 = detect and tag (default 1).
# Detection works from the transform: a skybox translates with the camera while
# its rotation holds still, so it also catches untextured domes that no
# texture-hash list can reach. You want 2.
RemixSkyAutoDetect = 2

# Scale each classified sky mesh out about the camera position, so it clears the
# world instead of occluding it. Every vertex keeps its direction from the eye,
# so the picture is unchanged angle-for-angle. This is what the console gets from
# drawing the sky with depth-write off; here it is expressed as geometry.
# RemixSkyAtInfinity = True
# RemixSkyInfinityScale = 16.0

# Draw the sky as an emissive surface with its albedo zeroed, so it is unlit -
# which is how the console draws it. With albedo left in place the sky would
# still take scene lighting and the intensity below would only shift the mix
# between two contributions rather than control the output.
# RemixSkyEmissive = True

# Sky brightness. Because auto-exposure normalises the total, this matters as a
# RATIO against RemixLightScale below, not as an absolute number. Lower it if the
# scene reads too blue - a nearly-overhead sun means vertical surfaces are lit
# mostly by sky.
# RemixSkyEmissiveIntensity = 1.0

# --- Lights ---

# Overall scale on the game's own lights. See the note above about ratios.
# RemixLightScale = 1.0

# GameCube games build a sun as a spot light parked ~25000 units away with both
# attenuation polynomials pinned at 1 - no distance falloff and no cone. Treating
# that as an ordinary point light applies a 1/r^2 the console never did, so the
# sun contributes almost nothing and the scene renders dark WITH a light in it.
# Only the fully falloff-free case is rerouted; a spot with a real cone keeps its
# shaping.
# RemixGxLightNoFalloffDistant = True

# Drop the game's DIRECTIONAL lights so an atmosphere mod owns the key light.
# Positional lights (lamps, glows, cone lights) are kept - they are local set
# dressing that a sky does not replace. Default off, because with no sky mod this
# removes the scene's only key light. Turning it on also implies
# RemixFallbackLight = False (see below).
# RemixGxLightDropDistant = False

# Many GC titles bake their lighting into vertex colours and enable no XF lights
# at all, so the backend adds one distant light on any frame that submitted zero.
# Turn this off if you are supplying light some other way.
# RemixFallbackLight = True

# --- Performance ---

# The UI overlay is rasterized on the CPU and is fill-rate bound. Lower this if
# frame rate is poor: 0.5 quarters the pixel cost. GC UI is authored for a
# 640x528 framebuffer, so there is little real detail to lose on a big window.
# RemixUiOverlayScale = 1.0

# --- Diagnostics ---

# Per-frame statistics line in the log. Needs Logger.ini to have Video = True,
# Verbosity = 4 and WriteToFile = True.
RemixLogStats = True

# Dump the composited UI overlay on this frame to Logs\remix-ui-overlay.bmp,
# drawn over a checkerboard so transparent and black are distinguishable.
# 0 disables.
# RemixUiDumpFrame = 0

# Paint every world draw a flat colour naming which colour route it took:
# red = vertex colour folded through the TEV chain, magenta = vertex colour
# unfolded, blue = per-draw constant tint, green = no rasterized colour. This is
# the fastest way to say WHICH PIXELS a colour bug owns.
# RemixDebugColorRoutes = False

# Per-draw colour trace to the log: TEV chain, both channels' lighting state,
# resolved arguments, raw vertex bytes, and the albedo texture's mean colour.
# Very verbose.
# RemixTraceColors = False

# --- Correctness knobs (listed so you can bisect) ---
#
# Each of these fixes a specific way this backend used to misread GameCube
# graphics state. They are ON by default and you should leave them on. They are
# listed because setting one to False restores the OLD behaviour EXACTLY, which
# makes it easy to say "this game broke because of that one" in a bug report.

# NEW IN v0.0.3 - resolve colour through the TEV chain. GC titles keep colour in
# TEV registers and use the per-vertex value only as the blend WEIGHT between two
# of them, so submitting the vertex value as a tint renders those surfaces white.
# Chains that never reference the vertex value resolve to a per-draw constant.
# RemixGxTevColor = True

# NEW IN v0.0.3 - read the texture (and its coordinate) from whichever TEV stage
# actually samples one, not always stage 0. Wind Waker's ocean samples nothing on
# stage 0 and has its water texture on stage 1.
# RemixGxTextureStage = True

# NEW IN v0.0.3 - drop an untextured orthographic draw that is either before any
# world geometry this frame, or paints exactly a rect whose EFB copy is
# discarded. Games clear the framebuffer by drawing plain white rectangles, and
# this backend composites 2D OVER the traced image - so a draw meant to sit
# underneath the scene lands over it. This is the Battle for Bikini Bottom white
# box and white screen.
# RemixUiDropPreWorldBlank = True

# Takes the rasterized colour channel from the TEV stage that actually reads it,
# rather than always from stage 0. Separate knobs for world geometry and for the
# UI overlay, because they fail in opposite directions.
# RemixGxRasChannel = True
# RemixUiRasChannel = True     <- this one removes leaked HUD sprites

# Scales the UI overlay by the region the console presents (the XFB copy rect)
# instead of the EFB's 640x528. Without it the bottom ~10% of the window is dead.
# RemixUiScaleToXfb = True

# Folds each draw's viewport difference into its instance transform, so draws
# rendered through a sub-screen viewport are not placed mid-screen.
# RemixViewportFix = True

# Same idea for per-draw projection differences.
# RemixProjectionFix = True

# Skips draws the game scissored down to nothing. They render nothing on console.
# RemixWorldScissorSkip = True

# Skips UI draws whose blend factor reads destination alpha. A screen overlay is
# composited at present time, so there is no framebuffer alpha for it to read.
# RemixUiDropDstAlpha = True

# --- EFB copies (new in v0.0.3, groundwork) ---
#
# Every copy the game makes of the embedded framebuffer is classified and then
# either executed or discarded. Discarding is what this backend always did, and
# for shadow maps, mirrored-camera reflections and bloom taps it is DESIRABLE:
# the path tracer does those natively, and reproducing the game's screen-space
# fake would put it on top of the real one. The fall-through arm is discard, so
# an unclassified copy can never look worse than before.

# Master switch. False = discard everything, exactly as v0.0.2 did.
# RemixEfbEmulation = True

# Copies of a screen with no 3D in it yet - menus, text windows, file select.
# These are exact by construction, so this is the one class that executes.
# RemixEfbCopy2D = True

# Copies containing world geometry. OFF on purpose - see above. Turning this on
# replaces "invisible fake effect, traced result shows through" with a flat
# clear-coloured rectangle.
# RemixEfbCopyScene = False
# RemixEfbCopyDepth = False
# RemixEfbCopyIntensity = False
# RemixEfbXfbEncode = False

# Fold the 2D overlay layer into an executed copy. Only has an effect in the
# default RemixUiMode = 1.
# RemixEfbUiCompose = True

# Skip draws that sample a copy destination we discarded. Fires as intended but
# has not been shown to fix anything visible - turn it off first if a game looks
# like it is missing draws.
# RemixEfbSkipDiscardedTex = True
